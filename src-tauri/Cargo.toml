# src-tauri/Cargo.toml
[package]
name = "diff-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "diff_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rayon = "1.7"
num_cpus = "1.16"
walkdir = "2.4"
tree-sitter = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-java = "0.20"
tree-sitter-cpp = "0.20"
tree-sitter-go = "0.20"
tree-sitter-typescript = "0.20"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "diff_benchmark"
harness = false

[profile.release]
panic    = "abort"
codegen-units = 1
lto      = true
opt-level = 3
strip    = true
debug    = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
